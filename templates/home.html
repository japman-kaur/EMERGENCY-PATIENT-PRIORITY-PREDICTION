<!DOCTYPE html>
<html>
<head>
    <title>Emergency Triage Priority Prediction</title>
</head>
<body>
    <h1>AI-Based Emergency Patient Priority Prediction</h1>
    <form action="/predict" method="post">
        <input type="hidden" name="Unnamed: 0" value="0">
        <label>age:</label><input type="number" name="age" required><br>
        <label>plasma glucose:</label><input type="number" name="plasma glucose" required><br>
        <label>blood pressure:</label><input type="number" name="blood pressure" required><br>
        <label>bmi:</label><input type="number" step="0.1" name="bmi" required><br>
        <label>Skin Thickness:</label><input type="number" name="skin_thickness" required><br>
        <label>Insulin:</label><input type="number" name="insulin" required><br>
        <label>Diabetes Pedigree:</label><input type="number" step="0.01" name="diabetes_pedigree" required><br>
        <label>Cholesterol:</label><input type="number" name="cholesterol" required><br>
        <label>Max Heart Rate:</label><input type="number" name="max heart rate" required><br>
        <label>Hypertension (0/1):</label><input type="number" name="hypertension" required><br>
        <label>Heart Disease (0/1):</label><input type="number" name="heart_disease" required><br>
        <label>Exercise Angina (0/1):</label><input type="number" name="exercise angina" required><br>
        <label>Smoking Status (0/1):</label><input type="number" name="smoking_status" required><br>
        <label>Gender (0/1):</label><input type="number" name="gender" required><br>
        <label>Chest Pain Type:</label><input type="number" name="chest pain type" required><br>
        <label>Residence Type (0/1):</label><input type="number" name="Residence_type" required><br>
        <button type="submit">Predict</button>
    </form>
    {% if prediction_text %}
        <h2>{{ prediction_text }}</h2>
    {% endif %}
</body>
</html>
